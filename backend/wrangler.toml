name = "eiquekies-api"
main = "src/index.js"
compatibility_date = "2024-03-01"

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "eiquekies_db"
database_id = "YOUR_CLOUDFLARE_D1_DATABASE_ID"

# R2 Storage Binding (Untuk Simpan Gambar Kek / Resipi)
[[r2_buckets]]
binding = "GALLERY_BUCKET"
bucket_name = "eiquekies-assets"

[vars]
ENVIRONMENT = "production"
JWT_SECRET = "eiquekies_super_secret_jwt_key_2026_cute_bakery"
